name: ${PROJECT_NAME:-myapp}

x-app: &app
  image: ${PROJECT_NAME:-myapp}-backend:${TAG:-local}
  build: ./backend
  env_file: .env
  environment:
    DATABASE_URL: postgresql+psycopg://app:app@db:5432/app
    REDIS_URL: redis://redis:6379/0
  depends_on:
    db: { condition: service_healthy }
    redis: { condition: service_healthy }

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports: ["${DB_PORT:-5432}:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/scripts/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    ports: ["${REDIS_PORT:-6379}:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  migrate:
    <<: *app
    profiles: ["app"]
    command: ["alembic", "upgrade", "head"]
    restart: "no"

  api:
    <<: *app
    profiles: ["app"]
    command: ["uvicorn", "app.api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports: ["${API_PORT:-8000}:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready')"]
      interval: 3s
      timeout: 3s
      retries: 20
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  web:
    image: ${PROJECT_NAME:-myapp}-web:${TAG:-local}
    build: ./frontend
    profiles: ["app"]
    ports: ["${APP_PORT:-8080}:80"]
    depends_on: [api]

  worker:
    <<: *app
    profiles: ["app"]
    command: ["celery", "-A", "app.worker.celery_app", "worker", "-Q", "default,llm", "-c", "2", "--loglevel=INFO"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

volumes:
  pgdata:
